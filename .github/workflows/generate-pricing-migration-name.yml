name: Generate Pricing Migration Name

on:
  push:
    branches:
      - feat/pricing-persistence

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.52.3
      - name: Generate migration filename only
        run: |
          supabase migration new pricing_persistence_16c2
          find supabase/migrations -maxdepth 1 -type f -name '*_pricing_persistence_16c2.sql' -printf 'GENERATED_MIGRATION=%f\n'
