name: Runtime dependency update diagnostic (temporary)
on:
  push:
    branches:
      - fix/security-runtime-deps-20261104
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install without package lifecycle scripts
        run: npm ci --ignore-scripts --no-audit
      - name: Produce compatible audit fix in runner only
        shell: bash
        run: |
          npm audit fix --package-lock-only --ignore-scripts --no-fund > /tmp/audit-fix-output.txt 2>&1 || true
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { execFileSync } from "node:child_process";
          const before=JSON.parse(execFileSync("git",["show","HEAD:package-lock.json"],{encoding:"utf8",maxBuffer:5_000_000}));
          const after=JSON.parse(fs.readFileSync("package-lock.json","utf8"));
          const changed=Object.fromEntries(Object.entries(after.packages??{}).filter(([k,v])=>JSON.stringify(v)!==JSON.stringify(before.packages?.[k])));
          const removed=Object.keys(before.packages??{}).filter(k=>!Object.hasOwn(after.packages??{},k));
          const top=Object.fromEntries(Object.entries(after).filter(([k,v])=>k!=="packages"&&JSON.stringify(v)!==JSON.stringify(before[k])));
          console.log("LOCK_DELTA="+JSON.stringify({changed,removed,top}));
          console.log("LOCK_CHANGE_COUNT="+JSON.stringify({changed:Object.keys(changed).length,removed:removed.length,top:Object.keys(top)}));
          NODE
          npm audit --omit=dev --json > /tmp/audit-runtime-after.json || true
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const a=JSON.parse(fs.readFileSync("/tmp/audit-runtime-after.json","utf8"));
          console.log("RUNTIME_AUDIT_AFTER="+JSON.stringify({counts:a.metadata?.vulnerabilities,packages:Object.entries(a.vulnerabilities??{}).map(([name,v])=>({name,severity:v.severity,fixAvailable:v.fixAvailable}))}));
          NODE
