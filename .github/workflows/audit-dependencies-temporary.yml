name: Audit dependencies (temporary investigation)
on:
  push:
    branches:
      - fix/os-history-ptbr-20261104
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit
      - name: Audit runtime and complete dependency tree
        shell: bash
        run: |
          npm audit --json > /tmp/audit-full.json || true
          npm audit --omit=dev --json > /tmp/audit-runtime.json || true
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          for (const [scope,path] of [["full","/tmp/audit-full.json"],["runtime","/tmp/audit-runtime.json"]]) {
            const report=JSON.parse(fs.readFileSync(path,"utf8"));
            const entries=Object.entries(report.vulnerabilities??{}).map(([name,v])=>({
              name, severity:v.severity, direct:v.isDirect, fixAvailable:v.fixAvailable,
              via:(v.via??[]).map(y=>typeof y==="string"?{dependency:y}:{name:y.name,title:y.title,range:y.range,source:y.url,severity:y.severity}).slice(0,5),
              effects:v.effects,
            }));
            console.log("SECURITY_AUDIT_REPORT="+JSON.stringify({scope,counts:report.metadata?.vulnerabilities,entries}));
          }
          NODE
