name: Generate Official Pricing Migration Name

on:
  push:
    branches:
      - feat/official-pricing-calculation

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.52.3
      - name: Generate migration filename only
        run: |
          supabase migration new official_pricing_calculation_context
          find supabase/migrations -maxdepth 1 -type f -name '*_official_pricing_calculation_context.sql' -printf 'GENERATED_MIGRATION=%f\n'
