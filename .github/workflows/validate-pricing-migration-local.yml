name: Validate Pricing Migration Locally

on:
  push:
    branches:
      - feat/pricing-persistence

jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Verify PostgreSQL client
        run: psql --version
      - name: Create minimal Supabase-compatible roles and dependencies
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin bypassrls;
          create extension if not exists pgcrypto;
          create table public.profiles(id uuid primary key, role text);
          create table public.products(id uuid primary key);
          grant usage on schema public to service_role;
          grant select on public.profiles, public.products to service_role;
          SQL
      - name: Apply Pricing migration
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261006140528_pricing_persistence_16c2.sql
      - name: Exercise Pricing lifecycle and numeric transport
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          insert into public.profiles(id,role)
          values ('10000000-0000-4000-8000-000000000009','gerente');
          insert into public.products(id)
          values ('10000000-0000-4000-8000-000000000004');

          set role service_role;

          select
            (r->>'policy_id')::uuid as policy_id,
            (r->>'version_id')::uuid as version_id
          from (
            select public.pricing_create_policy_secure(
              'TEST_POLICY','Test Policy',null,'ACTIVE',
              '1.2500000000000000001'::numeric,null,
              '10000000-0000-4000-8000-000000000009'::uuid,
              '1.0','1.0','MARKUP_ON_COST','TOTAL_COST'
            ) as r
          ) x
          \gset

          select public.pricing_transition_version_secure(
            :'version_id'::uuid,1,'VALIDATING',
            '10000000-0000-4000-8000-000000000009'::uuid
          );

          select public.pricing_publish_version_secure(
            :'version_id'::uuid,1,null,
            '10000000-0000-4000-8000-000000000009'::uuid
          );

          select public.pricing_set_product_settings_secure(
            '10000000-0000-4000-8000-000000000004'::uuid,
            :'policy_id'::uuid,
            '250.00'::numeric,
            null,
            '10000000-0000-4000-8000-000000000009'::uuid
          );

          select public.pricing_set_payment_term_secure(
            1,'0'::numeric,null,
            '10000000-0000-4000-8000-000000000009'::uuid
          );

          select public.pricing_set_payment_term_secure(
            6,'0.055'::numeric,null,
            '10000000-0000-4000-8000-000000000009'::uuid
          );

          do $
          begin
            begin
              perform public.pricing_set_payment_term_secure(
                7,'NaN'::numeric,null,
                '10000000-0000-4000-8000-000000000009'::uuid
              );
              raise exception 'expected NaN payment-rate rejection';
            exception
              when others then
                if sqlerrm not like '%INVALID_PRICING_CONFIGURATION%' then
                  raise;
                end if;
            end;

            begin
              perform public.pricing_set_product_settings_secure(
                '10000000-0000-4000-8000-000000000004'::uuid,
                (select pricing_policy_id
                 from public.product_pricing_settings
                 where product_id='10000000-0000-4000-8000-000000000004'::uuid),
                'Infinity'::numeric,
                1,
                '10000000-0000-4000-8000-000000000009'::uuid
              );
              raise exception 'expected Infinity minimum rejection';
            exception
              when others then
                if sqlerrm not like '%INVALID_PRICING_CONFIGURATION%' then
                  raise;
                end if;
            end;
          end;
          $;

          do $
          begin
            begin
              perform public.pricing_set_payment_term_secure(
                2,'0.01'::numeric,null,
                '10000000-0000-4000-8000-000000000009'::uuid
              );
              raise exception 'expected 1x-3x non-zero rate rejection';
            exception
              when others then
                if sqlerrm not like '%INVALID_PRICING_CONFIGURATION%' then
                  raise;
                end if;
            end;
          end;
          $$;

          select 1 / case when
            jsonb_typeof(
              public.pricing_get_version_definition_secure(:'version_id'::uuid)->'markup'
            ) = 'string'
            then 1 else 0 end;

          select 1 / case when
            jsonb_typeof(
              public.pricing_get_product_settings_secure(
                '10000000-0000-4000-8000-000000000004'::uuid
              )->'minimum_selling_price'
            ) = 'string'
            then 1 else 0 end;

          select 1 / case when
            jsonb_typeof(public.pricing_get_payment_term_secure(6)->'rate') = 'string'
            then 1 else 0 end;

          reset role;

          select 1 / case when
            not has_table_privilege(
              'authenticated','public.pricing_policies','SELECT'
            )
            then 1 else 0 end;

          select 1 / case when
            not has_function_privilege(
              'authenticated',
              'public.pricing_create_policy_secure(text,text,text,text,numeric,text,uuid,text,text,text,text)',
              'EXECUTE'
            )
            then 1 else 0 end;

          select 1 / case when
            not has_table_privilege(
              'service_role','public.pricing_policies','DELETE'
            )
            then 1 else 0 end;
          SQL
