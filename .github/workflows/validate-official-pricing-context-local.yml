name: Validate Official Pricing Context Locally

on:
  push:
    branches:
      - feat/official-pricing-calculation

jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Create minimal Pricing persistence surface
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin bypassrls;

          create table public.product_pricing_settings(
            product_id uuid primary key,
            pricing_policy_id uuid not null,
            minimum_selling_price numeric not null,
            revision integer not null,
            updated_at timestamptz not null,
            updated_by uuid not null
          );
          create table public.pricing_policies(
            id uuid primary key,
            code text not null,
            name text not null,
            description text,
            status text not null,
            revision integer not null,
            created_at timestamptz not null,
            created_by uuid not null,
            updated_at timestamptz not null,
            updated_by uuid not null
          );
          create table public.pricing_policy_versions(
            id uuid primary key,
            pricing_policy_id uuid not null,
            version_number integer not null,
            revision integer not null,
            schema_version text not null,
            engine_version text not null,
            status text not null,
            strategy_type text not null,
            markup numeric not null,
            markup_base text not null,
            notes text,
            created_at timestamptz not null,
            created_by uuid not null,
            published_at timestamptz,
            published_by uuid
          );
          create table public.pricing_payment_terms(
            installments smallint primary key,
            rate numeric not null,
            revision integer not null,
            updated_at timestamptz not null,
            updated_by uuid not null
          );

          grant usage on schema public to service_role;
          grant select on public.product_pricing_settings to service_role;
          grant select on public.pricing_policies to service_role;
          grant select on public.pricing_policy_versions to service_role;
          grant select on public.pricing_payment_terms to service_role;
          SQL
      - name: Apply Official Pricing context migration
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1             -f supabase/migrations/20261006163140_official_pricing_calculation_context.sql
      - name: Exercise official context
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          insert into public.pricing_policies(
            id,code,name,description,status,revision,
            created_at,created_by,updated_at,updated_by
          ) values (
            '10000000-0000-4000-8000-000000000001',
            'STANDARD','Standard',null,'ACTIVE',1,
            now(),'10000000-0000-4000-8000-000000000009',
            now(),'10000000-0000-4000-8000-000000000009'
          );

          insert into public.pricing_policy_versions(
            id,pricing_policy_id,version_number,revision,
            schema_version,engine_version,status,strategy_type,
            markup,markup_base,notes,created_at,created_by,published_at,published_by
          ) values (
            '10000000-0000-4000-8000-000000000002',
            '10000000-0000-4000-8000-000000000001',
            1,1,'1.0','1.0','PUBLISHED','MARKUP_ON_COST',
            '1.25'::numeric,'TOTAL_COST',null,now(),
            '10000000-0000-4000-8000-000000000009',now(),
            '10000000-0000-4000-8000-000000000009'
          );

          insert into public.product_pricing_settings(
            product_id,pricing_policy_id,minimum_selling_price,
            revision,updated_at,updated_by
          ) values (
            '10000000-0000-4000-8000-000000000004',
            '10000000-0000-4000-8000-000000000001',
            '120.50'::numeric,2,now(),
            '10000000-0000-4000-8000-000000000009'
          );

          insert into public.pricing_payment_terms(
            installments,rate,revision,updated_at,updated_by
          ) values (
            6,'0.055'::numeric,4,now(),
            '10000000-0000-4000-8000-000000000009'
          );

          set role service_role;

          select 1 / case when
            public.pricing_get_official_calculation_context_secure(
              '10000000-0000-4000-8000-000000000004',2
            )->'payment_term'->>'source' = 'SYSTEM_ZERO'
            then 1 else 0 end;

          select 1 / case when
            public.pricing_get_official_calculation_context_secure(
              '10000000-0000-4000-8000-000000000004',2
            )->'payment_term'->>'rate' = '0'
            then 1 else 0 end;

          select 1 / case when
            public.pricing_get_official_calculation_context_secure(
              '10000000-0000-4000-8000-000000000004',6
            )->'payment_term'->>'source' = 'CONFIGURED'
            then 1 else 0 end;

          select 1 / case when
            jsonb_typeof(
              public.pricing_get_official_calculation_context_secure(
                '10000000-0000-4000-8000-000000000004',6
              )->'markup'
            ) = 'string'
            then 1 else 0 end;

          select 1 / case when
            jsonb_typeof(
              public.pricing_get_official_calculation_context_secure(
                '10000000-0000-4000-8000-000000000004',6
              )->'product_settings'->'minimum_selling_price'
            ) = 'string'
            then 1 else 0 end;

          select 1 / case when
            jsonb_typeof(
              public.pricing_get_official_calculation_context_secure(
                '10000000-0000-4000-8000-000000000004',6
              )->'payment_term'->'rate'
            ) = 'string'
            then 1 else 0 end;

          reset role;

          select 1 / case when
            not has_function_privilege(
              'anon',
              'public.pricing_get_official_calculation_context_secure(uuid,integer)',
              'EXECUTE'
            )
            then 1 else 0 end;

          select 1 / case when
            not has_function_privilege(
              'authenticated',
              'public.pricing_get_official_calculation_context_secure(uuid,integer)',
              'EXECUTE'
            )
            then 1 else 0 end;

          select 1 / case when
            has_function_privilege(
              'service_role',
              'public.pricing_get_official_calculation_context_secure(uuid,integer)',
              'EXECUTE'
            )
            then 1 else 0 end;

          set role service_role;
          set ON_ERROR_STOP off

          select public.pricing_get_official_calculation_context_secure(
            '10000000-0000-4000-8000-000000000004',7
          );
          if :ERROR
            echo 'Expected missing 7x payment term rejection observed'
          else
            quit 1
          endif

          set ON_ERROR_STOP on
          reset role;
          SQL
